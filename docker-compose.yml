version: '3.8'

services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://recoverai:recoverai@db:5432/recoverai
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - APP_ENV=production
      - LOG_LEVEL=INFO
    depends_on:
      db:
        condition: service_healthy
    restart: always

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=recoverai
      - POSTGRES_PASSWORD=recoverai
      - POSTGRES_DB=recoverai
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recoverai"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
